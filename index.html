<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Write</title>
<link rel="shortcut icon" href="fav.png" type="image/x-icon">
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffb6c1;
    font-family: Arial, sans-serif;
    padding: 16px;
}

.form-container {
    width: 100%;
    max-width: 580px;
    padding: 40px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    text-align: center;
}

h2 {
    font-size: 34px;
    margin-bottom: 24px;
}

input,
textarea {
    width: 100%;
    padding: 18px;
    margin: 16px 0;
    font-size: 22px;
    border-radius: 14px;
    border: 1px solid #ccc;
}

textarea {
    height: 160px;
    resize: none;
}

button {
    width: 100%;
    padding: 18px;
    font-size: 22px;
    border-radius: 14px;
    border: none;
    background: #ff69b4;
    color: #fff;
    cursor: pointer;
}

button:hover {
    background: #ff1493;
}

.link-section {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #f2f2f2;
    border-radius: 14px;
    width: 100%;
    overflow: hidden;
}

.link-section span {
    flex: 1;
    white-space: nowrap;
    overflow-x: auto;
    font-size: 15px;
    padding-right: 6px;
}

.copy-btn {
    flex-shrink: 0;
    padding: 10px 16px;
    font-size: 15px;
    border-radius: 10px;
    cursor: pointer;
    width: 6rem;
}

/* Mobile */
@media (max-width: 480px) {
    .form-container {
        padding: 24px;
        border-radius: 16px;
    }

    h2 {
        font-size: 26px;
    }

    input,
    textarea {
        font-size: 18px;
        padding: 14px;
    }

    textarea {
        height: 130px;
    }

    button {
        font-size: 18px;
        padding: 14px;
    }

    .link-section span {
        font-size: 13px;
    }

    .copy-btn {
        font-size: 14px;
        padding: 8px 12px;
    }
}

/* Tablet */
@media (max-width: 768px) {
    .form-container {
        padding: 32px;
    }

    h2 {
        font-size: 30px;
    }

    input,
    textarea {
        font-size: 20px;
        padding: 16px;
    }

    button {
        font-size: 20px;
        padding: 16px;
    }

    .link-section span {
        font-size: 14px;
    }

    .copy-btn {
        font-size: 14px;
        padding: 10px 14px;
    }
}



</style>
</head>
<body>

<div class="form-container">
<h2>Send Message</h2>
<input id="name" placeholder="TO: Name">
<textarea id="message" placeholder="Message"></textarea>
<button onclick="generate()">Generate Link</button>
<div id="linkSection" class="link-section" style="display:none">
<span id="output"></span>
<button class="copy-btn" onclick="copy()">Copy</button>

const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?:;'\"-_@#/()+=%&";
const base="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

const charMap={};
for(let i=0;i<alphabet.length;i++){
charMap[alphabet[i]]=base[Math.floor(i/62)]+base[i%62];
}

function encode(text){
const out=[];
const parts=text.split(/(\s+)/);
for(const p of parts){
const k=p.toLowerCase();
if(wordMap[k]) out.push(wordMap[k]);
else for(const c of p) out.push(charMap[c]||"zz");
}
return encodeURIComponent(out.join("&"));
}

function generate(){
const n=document.getElementById("name").value.trim();
const m=document.getElementById("message").value.trim();
if(!n||!m)return alert("Fill all fields");
const link=`https://tribrix23.github.io/valentines/mail?n=${encode(n)}&m=${encode(m)}`;
document.getElementById("output").textContent=link;
document.getElementById("linkSection").style.display="flex";
}

function copy(){
navigator.clipboard.writeText(document.getElementById("output").textContent);
alert("Copied");
