<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail</title>
<link rel="shortcut icon" href="fav.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root {
    --bg-pink: #ffdae0;
    --white: #ffffff;
    --shadow: rgba(0, 0, 0, 0.1);
    --pink: #ff69b4;
    --black: #222;
}
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-pink);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Dancing Script', cursive;
    perspective: 1200px;
}
.container {
    position: relative;
    width: 280px;
    height: 180px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}
.envelope {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, #ffffff, #f8f8f8);
    border-radius: 4px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.08),0 15px 25px rgba(0,0,0,0.12),inset 0 0 10px rgba(0,0,0,0.02);
    z-index: 2;
    transition: transform 1.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease;
}
.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 110px solid #F5F5F5;
    transform-origin: top;
    transition: transform 0.7s ease-in;
    z-index: 4;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15));
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
    border-bottom: 1px solid rgba(0,0,0,0.1);
}
.card {
    position: absolute;
    width: 260px;
    height: 160px;
    background: var(--white);
    z-index: 1;
    display: flex;
    flex-direction: column;
    border-radius: 4px;
    box-shadow: 0 0 20px var(--shadow);
    transition: all 1.8s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0.9;
}
.title-text {
    font-size: 2rem;
    color: var(--pink);
    text-align: center;
    margin-top: 1.5rem;
    opacity: 0;
    transition: opacity 1s ease 0.5s, font-size 1.5s ease;
}
.message-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}
.message-text {
    font-size: 1rem;
    color: var(--black);
    text-align: center;
    line-height: 1.5;
    opacity: 0;
    transition: opacity 1s ease 0.8s, font-size 1.5s ease;
    word-wrap: break-word;
    overflow-wrap: break-word;
    text-align: center;
    padding: 0 0.5rem;
}
.active .envelope::before {transform: rotateX(180deg); z-index:0;}
.active .envelope {transform: translateY(120vh) rotate(5deg); opacity:0;}
.active .card {width:90vw; height:80vh; transform:translateY(0) scale(1); z-index:10; opacity:1; box-shadow:0 0 50px rgba(0,0,0,0.05); flex-direction:column;}
.active .title-text {opacity:1; font-size:3.5rem;}
.active .message-text {opacity:1; font-size:2rem;}
.flower {position: fixed; font-size: 0; transition: transform 1.5s ease, font-size 1.5s ease;}

@media (max-width: 768px) {
    .container {
        width: 200px;
        height: 130px;
    }
    .envelope::before {
        border-left: 100px solid transparent;
        border-right: 100px solid transparent;
        border-top: 80px solid #F5F5F5;
    }
    .card {
        width: 180px;
        height: 120px;
    }
    .title-text {
        font-size: 1.2rem;
    }
    .message-text {
        font-size: 0.8rem;
        line-height: 1.2;
        word-break: break-word;
    }
}

@media (max-width: 480px) {
    .container {
        width: 150px;
        height: 100px;
    }
    .envelope::before {
        border-left: 75px solid transparent;
        border-right: 75px solid transparent;
        border-top: 60px solid #F5F5F5;
    }
    .card {
        width: 130px;
        height: 90px;
    }
    .title-text {
        font-size: 1rem;
    }
    .message-text {
        font-size: 0.7rem;
        line-height: 1.1;
        word-break: break-word;
    }
}

</style>
</head>
<body>
<audio id="bg-music" src="valentine.mp3" autoplay></audio>
<div class="container" id="mainContainer">
    <div class="envelope"></div>
    <div class="card">
        <div class="title-text" id="titleText">Happy Valentines!</div>
        <div class="message-container">
            <div class="message-text" id="messageText">Your message will appear here.</div>
        </div>
    </div>
</div>

<script>
const music = document.getElementById('bg-music');
let flowersCreated=false;
const wordMap={"love":"8a8","hello":"7h7","you":"3u3","miss":"6m6","hate":"5h5","yes":"2y2","no":"1n1","please":"9p9","thanks":"4t4","sorry":"0s0","happy":"5h5","birthday":"b1b","friend":"f2f","friendship":"f3f","good":"g1g","morning":"m1m","night":"n1n","day":"d1d","week":"w1w","weekend":"w2w","loveu":"l1l","hug":"h1h","kiss":"k1k","missu":"m2m","dear":"d2d","sweet":"s1s","cute":"c1c","beautiful":"b2b","handsome":"h2h","fun":"f4f","play":"p1p","game":"g2g","party":"p2p","family":"f5f","friendzone":"f6f","school":"s2s","study":"s3s","work":"w3w","home":"h3h","travel":"t1t","food":"f7f","drink":"d3d","coffee":"c2c","tea":"t2t","sleep":"s4s","dream":"d4d","song":"s5s","music":"m3m","movie":"m4m","funny":"f8f","cuteu":"c3c","loveu2":"l2l","huggy":"h3h","kissy":"k2k","smile":"s6s","laugh":"l3l","wow":"w4w","omg":"o1o","yespls":"y1y","nopls":"n2n","i":"i1i","me":"m9m","my":"m8m","mine":"m7m","we":"w9w","us":"u9u","our":"o9o","hi":"h9h","hey":"h8h","bye":"b9b","goodbye":"g9g","welcome":"w8w","forever":"f9f","always":"a9a","together":"t9t","promise":"p9p","heart":"h7h","hearts":"h6h","crush":"c9c","valentine":"v9v","date":"d9d","care":"c8c","trust":"t8t","hope":"h8x","believe":"b8b","faith":"f8x","thinking":"t7t","thinkingofyou":"t6t","missingyou":"m6x","iloveyou":"i8i","ily":"i7i","best":"b7b","bestie":"b6b","foreverandever":"f6f","goodluck":"g8g","congrats":"c7c","cheers":"c6c","ok":"o2o","okay":"o3o","fine":"f0f","sure":"s0s","maybe":"m0m","where":"w5w","when":"w6w","why":"w7w","what":"w8x","how":"h0h","again":"a0a","later":"l0l","soon":"s9s","now":"n9n","today":"t0t","tomorrow":"t3t","yesterday":"y0y","wait":"w0w","ready":"r0r","busy":"b0b","free":"f1f","call":"c0c","text":"x0x","reply":"r1r","send":"s7s","receive":"r2r","see":"s8s","look":"l4l","watch":"w1w","feel":"f2f","think":"t4t","know":"k0k","understand":"u0u","remember":"r3r","forget":"f3f","missed":"m5m","waiting":"w2w","online":"o4o","offline":"o5o","safe":"s1x","careful":"c4c","strong":"s2x","forevermore":"f4x"};
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!?:;'\"-_@#/()+=%&";
const base = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

const encodeChar = c => {const i=alphabet.indexOf(c);return i===-1?"zz":base[Math.floor(i/62)]+base[i%62];};
const decodeChar = token => {const i=base.indexOf(token[0])*62+base.indexOf(token[1]);return alphabet[i]||"";};

function decode(text){
    if(!text) return "";
    const parts=text.split("&");
    const result=[];
    for(const p of parts){
        if(Object.values(wordMap).includes(p)){result.push(Object.keys(wordMap).find(k=>wordMap[k]===p));}
        else{result.push(decodeChar(p));}
    }
    return result.join("");
}

function getParam(k){return new URLSearchParams(window.location.search).get(k);}

function openLetter(){
    music.play()
    const container=document.getElementById('mainContainer');
    container.classList.add('active');
    const n=getParam("n");
    const m=getParam("m");
    if(n) document.getElementById("titleText").textContent="Happy Valentine, "+decode(n)+"!";
    if(m) document.getElementById("messageText").innerHTML=decode(m).replace(/\n/g,"<br>");
    if(flowersCreated) return;
    flowersCreated=true;
    const corners=[{top:'-50px',left:'-50px'},{top:'-50px',right:'-50px'},{bottom:'-50px',left:'-50px'},{bottom:'-50px',right:'-50px'}];
    corners.forEach(c=>{for(let i=0;i<5;i++){const s=document.createElement('span');s.className='flower';s.innerText=Math.random()>0.5?'🌸':'🌺';Object.assign(s.style,c,{fontSize:'0'});document.body.appendChild(s);const x=(Math.random()*40+30)*(c.left?1:-1);const y=(Math.random()*40+30)*(c.top?1:-1);requestAnimationFrame(()=>{s.style.fontSize='50px'; s.style.transform=`translate(${x}px,${y}px)`;});}});
}

document.getElementById('mainContainer').addEventListener('click', openLetter);
</script>

</body>
</html>
